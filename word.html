<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>단어 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08121c; --panel:#0f1d2b; --panel2:#132638; --line:#264660; --line2:#2f5677;
  --text:#e8f1f8; --dim:#8aa3b8; --cyan:#46d2ff; --cyan2:#1c9fd1;
  --warn:#ffb547; --red:#ff5d6c; --ok:#5ee2a0;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font-family:'Noto Sans KR','Pretendard','Malgun Gothic',sans-serif}
body{word-break:keep-all;overflow-wrap:anywhere;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#12304a 0%,var(--bg) 60%) fixed,var(--bg)}
a{color:var(--cyan)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:#0a1724;border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
textarea{resize:vertical;line-height:1.55}
h1,h2,h3{margin:0}
main{padding:28px clamp(16px,3vw,48px) 96px}
body.present main{padding-bottom:24px}
.stage{min-height:calc(100vh - 130px)}
body.present .stage{min-height:calc(100vh - 52px)}
.kicker{letter-spacing:.22em;color:var(--cyan);font-size:13px;font-weight:700}
#menuPeek{display:none;position:fixed;top:6px;right:8px;z-index:30;background:rgba(15,29,43,.8);color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:4px 10px;opacity:0;transition:opacity .2s}
body.present #menuPeek{display:block}
#menuPeek:hover{opacity:1}

/* control bar */
.ctrl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:18px;align-items:center;padding:10px 18px;background:rgba(10,20,30,.97);border-top:1px solid var(--line);flex-wrap:wrap;z-index:15}
body.present .ctrl{display:none}
.ctrl .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl .hint{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-left:auto;padding-left:18px;border-left:1px solid var(--line)}
.ctrl .key{display:inline-flex;gap:4px;align-items:center}
.ctrl .key em{font-style:normal;font-size:14px;color:#c9d6e2;margin-left:4px}
.ctrl kbd{min-width:24px;text-align:center;padding:2px 7px;font-size:13px;font-weight:700;background:#1d3247;border-color:#3f6a8f;color:#fff}
.b{background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:7px 14px;border-radius:4px;font-size:14px}
.b:hover{border-color:var(--cyan2)}
.b.pri{background:var(--cyan2);border-color:var(--cyan);color:#001a26;font-weight:700}
.b.on{border-color:var(--cyan);color:var(--cyan)}
.b.danger{border-color:#6b2a33;color:#ff9aa4}
.b.sm{padding:4px 10px;font-size:13px}
kbd{background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:1px 6px;font-family:inherit;font-size:12px;color:var(--text)}

/* timer & qr */
.timerbox{text-align:center}
.timer{font-size:clamp(56px,6vw,84px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.1}
.timer.warn{color:var(--warn)}
.timer.done{color:var(--red)}
.tbtns{display:flex;gap:6px;justify-content:center;margin-top:6px}
body.present .tbtns{display:none}
.qrbox{background:#fff;color:#111;padding:14px;border-radius:8px;text-align:center}
.qrbox .qr{display:flex;justify-content:center;min-height:40px}
.qrbox .qr img,.qrbox .qr canvas{display:block}
.qrlabel{font-weight:700;margin-top:8px}
.qrurl{display:block;color:#0a58ca;font-size:13px;word-break:break-all;margin-top:4px}
.qrbox.empty{background:var(--panel);color:var(--dim);border:1px dashed var(--line2)}
.qrbox.qsmall .qr img,.qrbox.qsmall .qr canvas{width:120px!important;height:120px!important}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:20px}
.note{font-size:13px;color:var(--dim);text-align:center}
.src{font-size:13px;color:var(--dim);word-break:break-all}

/* shared blocks */
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.claims{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.claim{border:1px solid var(--line2);background:linear-gradient(180deg,#132a40,#0c1b2a);padding:18px 22px;border-radius:6px}
.claim .who{font-size:30px;font-weight:900;color:var(--cyan)}
.claim p{font-size:clamp(18px,1.6vw,24px);line-height:1.6;margin:6px 0 0}
.stats{display:flex;gap:14px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 18px;min-width:130px}
.stat b{display:block;font-size:34px;font-weight:900}
.stat span{color:var(--dim);font-size:13px}
.help{color:var(--dim);font-size:13px;margin:4px 0 10px;line-height:1.6}

/* modal */
#modal{position:fixed;inset:0;background:rgba(2,8,14,.86);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
#modal[hidden]{display:none}
.modal-in{background:var(--panel);border:1px solid var(--cyan2);border-radius:8px;max-width:1100px;width:100%;max-height:90vh;overflow:auto;padding:28px 32px}
.modal-in h2{font-size:clamp(22px,2.2vw,32px);margin:6px 0}
.modal-in .desc{color:var(--dim);margin:0 0 18px}
.reps{display:grid;gap:14px}
.reps blockquote{margin:0;background:#0a1724;border-left:3px solid var(--cyan);padding:16px 20px;font-size:clamp(17px,1.5vw,22px);line-height:1.7;white-space:pre-wrap}
.reps cite{display:block;color:var(--dim);font-size:14px;font-style:normal;margin-top:8px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* ops overlay */
#ops{position:fixed;inset:0;background:var(--bg);z-index:35;overflow:auto;padding:20px clamp(16px,3vw,48px) 40px}
#ops[hidden]{display:none}
.opsbar{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.warnline{background:rgba(255,93,108,.1);border:1px solid #6b2a33;color:#ffb3ba;padding:8px 12px;border-radius:4px;font-size:14px;margin-bottom:16px}
.dbox,.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px}
.dbox h3,.box h3{font-size:17px;margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.cnt{color:var(--cyan);font-size:14px;margin-left:8px}
.preview{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.6}
.preview .err{color:var(--red)}
label.file{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);padding:6px 12px;border-radius:4px;font-size:14px;cursor:pointer}
label.file input{display:none}
.fgrid{display:grid;grid-template-columns:220px 1fr;gap:10px 14px;align-items:start}
.fgrid label{color:var(--dim);font-size:14px;padding-top:8px}
.fgrid small{display:block;color:var(--dim);font-size:12px;margin-top:4px}
.ok{color:var(--ok)} .no{color:var(--warn)}

#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--cyan2);color:#001a26;padding:8px 16px;border-radius:4px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
#toast.show{opacity:1}

@media (max-width:900px){
  .two,.claims{grid-template-columns:1fr}
  .side{position:static}
  .fgrid{grid-template-columns:1fr}
  .fgrid label{padding-top:0}
}

/* 3. 금지어 게임 — 규칙 장면(멤버 제출 포함) · 다시 쓴 문장(진행자) */
.ban-word{display:inline-block;font-size:clamp(48px,6vw,96px);font-weight:900;position:relative;color:var(--warn);padding:0 18px;margin:10px 0 20px}
.ban-word:after{content:'';position:absolute;left:0;right:0;top:52%;height:8px;background:var(--red);transform:rotate(-8deg)}
.kA{color:#4aa8ff}.kB{color:#ffd23f}
.claim.A .who{color:#4aa8ff}.claim.B .who{color:#ffd23f}

/* ① 규칙 장면 */
.ruleview{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start;max-width:1280px;margin:0 auto}
.rulemain h1{font-size:clamp(22px,2.4vw,36px);line-height:1.5;margin-bottom:22px}
.mybox{margin-top:26px;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:20px 22px}
.mybox h2{font-size:20px;margin:0 0 4px}
.mybox .note{font-size:15px;color:#b8c7d4;margin:0 0 6px;line-height:1.6;text-align:left}
.mybox label{display:block;font-size:15px;color:#dbe4ec;margin:16px 0 7px}
.mybox label b{font-size:18px}
.mybox input,.mybox textarea{font-size:17px;padding:11px 13px}
.mybox textarea{line-height:1.65;min-height:90px}
.mybox textarea.bad{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.bwarn{color:#ffb3ba;font-size:14px;margin-top:6px;line-height:1.6}
.mybox .send{display:block;width:100%;margin-top:18px;padding:14px;font-size:18px}
.mybox .send:disabled{opacity:.4;cursor:default}
.mybox .err{color:#ff8a8a;font-size:14px;margin-top:10px}
.mybox.done h2{font-weight:300;font-size:26px}
.mybox .mine{display:flex;gap:10px;margin-top:10px;background:#0a1724;border-radius:4px;padding:12px 14px;font-size:16px;line-height:1.65;white-space:pre-wrap}
.mybox .mine b{flex:0 0 auto}
.mybox .mine:nth-of-type(1) b{color:#4aa8ff}.mybox .mine:nth-of-type(2) b{color:#ffd23f}
mark.ban{background:rgba(255,93,108,.25);color:#ffb3ba;border-bottom:2px solid var(--red);padding:0 2px}

/* ② 다시 쓴 문장 */
.wallview{max-width:1500px;margin:0 auto}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.wtitle{display:flex;gap:14px;align-items:center}
.wtitle .back{width:46px;height:46px;font-size:22px;background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:6px;cursor:pointer}
.wtitle h2{font-size:clamp(22px,2vw,30px)}
.winfo{font-size:14px;color:var(--dim)}
.winfo .cutnote{color:var(--cyan)}.winfo .lnk{color:var(--cyan);text-decoration:underline;cursor:pointer;font-weight:400}
.wbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{font-size:16px;font-weight:700;padding:11px 16px;background:var(--panel);color:var(--dim);border:0;cursor:pointer}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--cyan2);color:#001a26}
.tbtn{font:inherit;font-size:17px;font-weight:700;padding:11px 18px;border-radius:6px;cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--text)}
.tbtn.reload{border-color:var(--cyan2);color:var(--cyan)}
.tbtn.reset{border-color:#8a3a44;color:#ff9aa4}
.tbtn.main{background:var(--cyan2);border-color:var(--cyan);color:#001a26}
.tbtn kbd{font-size:13px;margin-left:4px}
.whint{color:var(--dim);font-size:14px;margin:0 0 14px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;padding-bottom:90px}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.bcard:hover{border-color:var(--line2)}
.bcard.sel{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan)}
.bcard .who{color:#dbe4ec;font-size:17px;font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between}
.bcard .who .picked{color:var(--cyan);font-size:13px}
.bcard .ln{display:flex;gap:10px;margin-top:8px;line-height:1.65;font-size:19px;white-space:pre-wrap}
.bcard .ln b{flex:0 0 auto;font-size:20px;font-weight:900}
.compare{display:grid;gap:18px;margin-top:10px}
.compare .bcard{cursor:default}
.compare .bcard{padding:22px 26px}
.compare .bcard .who{font-size:24px;margin-bottom:8px}
.compare .bcard .ln b{font-size:30px}
.compare .bcard .ln{font-size:clamp(22px,2vw,32px);gap:14px;margin-top:14px}
.wempty{max-width:760px;margin:60px auto;text-align:center;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:30px}
.wempty b{display:block;font-size:26px}
.wempty span{display:block;color:var(--dim);margin-top:10px;font-size:16px}
.selbar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:rgba(10,20,30,.97);border:1px solid var(--cyan2);border-radius:8px;padding:10px 14px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.selbar span{color:var(--text);font-size:16px;margin-right:4px}

@media (max-width:900px){
  .ruleview{grid-template-columns:1fr}
  .compare{grid-template-columns:1fr!important}
}
@media (max-width:760px){
  /* 폰(멤버): 시간 조작줄·타이머 숨김 — 시간은 진행자 화면 공유로 */
  .pconly,.ctrl{display:none!important}
  .claims{grid-template-columns:1fr}
  .mybox{padding:16px}
}
.hostnote{margin-top:26px;background:var(--panel);border:1px dashed var(--line2);border-radius:6px;padding:16px 20px;color:var(--dim);font-size:16px;line-height:1.7}
.hostnote b{color:var(--cyan);font-weight:500;word-break:break-all}

</style>
</head>
<body>
<main id="view"></main>
<div id="ops" hidden></div>
<div id="modal" hidden></div>
<div id="toast"></div>
<button id="menuPeek" data-act="present" title="조작줄 보이기 (P)">≡</button>
<script>
'use strict';
/* 공통: 상태 저장, 타이머, QR, 응답 붙여넣기, 운영 화면, 키보드. 각 페이지는 맨 끝에서 setPage({...})로 자기 화면을 등록한다. */

// 구글폼 응답 링크 (_src/설정.json → build.py가 넣음). 설정창(O)에서 바꾸면 그 브라우저에서는 그 값이 우선
const FORMS = {"q1": "https://forms.gle/V6y4CHsSqmuoboKV9", "ban": "https://forms.gle/HnCNosyLGXsz9WrN8", "mini": "https://forms.gle/CnLskyPxAmTcj5rPA", "post": "https://forms.gle/dbt5EXQKCXaER1bK6"};
function formOf(key) { return (S && S.cfg && S.cfg.form) || FORMS[key] || ''; }

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').replace(/\s+/g, '').toLowerCase();
const deep = o => JSON.parse(JSON.stringify(o));
function hash(s) { let x = 5381; for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return (x >>> 0).toString(36); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800); }
function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v) {
  const ks = p.split('.'); const last = ks.pop();
  const tgt = ks.reduce((a, k) => a[k], o);
  tgt[last] = typeof tgt[last] === 'number' ? (parseFloat(v) || 0) : v;
}
function merge(def, val) {
  if (val === undefined || val === null) return deep(def);
  if (Array.isArray(def)) return Array.isArray(val) ? val : deep(def);
  if (def && typeof def === 'object') {
    if (typeof val !== 'object') return deep(def);
    const o = {};
    for (const k of Object.keys(def)) o[k] = merge(def[k], val[k]);
    return o;
  }
  return typeof val === typeof def ? val : def;
}
function who(nick, i) { return U.anon ? '참여자 ' + (i + 1) : esc(nick || '참여자 ' + (i + 1)); }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('복사됨'); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('복사됨'); } catch (e) { toast('복사 실패 — 직접 선택해 복사하세요'); }
  ta.remove();
}
function seeded(arr, seed) {
  if (!seed) return arr.slice();
  const a = arr.slice(); let s = seed;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function beep() {
  try {
    const C = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35].forEach(d => { const o = C.createOscillator(), g = C.createGain(); o.frequency.value = 880; g.gain.value = .15;
      o.connect(g); g.connect(C.destination); o.start(C.currentTime + d); o.stop(C.currentTime + d + .22); });
  } catch (e) {}
}

/* ---------- state ---------- */
let PAGE = null, S = null, U = null;
function load() {
  const f = Object.assign({ cfg: deep(PAGE.cfg) }, PAGE.fresh());
  try {
    const s = JSON.parse(localStorage.getItem(PAGE.key) || 'null');
    if (!s) return f;
    for (const k of Object.keys(f)) {
      if (s[k] === undefined) continue;
      if (k === 'cfg') f.cfg = merge(PAGE.cfg, s.cfg);
      else if (f[k] && typeof f[k] === 'object' && !Array.isArray(f[k])) Object.assign(f[k], s[k]);
      else f[k] = s[k];
    }
  } catch (e) {}
  return f;
}
function save() {
  try { localStorage.setItem(PAGE.key, JSON.stringify(S)); }
  catch (e) { toast('브라우저 저장 실패 — 이 창을 닫으면 입력이 사라질 수 있습니다'); }
}
function saveU() { try { sessionStorage.setItem(PAGE.key + '_ui', JSON.stringify(U)); } catch (e) {} }
function setPage(p) {
  PAGE = p;
  S = load();
  let u = {};
  try { u = JSON.parse(sessionStorage.getItem(PAGE.key + '_ui') || '{}'); } catch (e) {}
  U = Object.assign({ present: false, ops: false, opsTab: PAGE.opsTabs[0][0], anon: true }, deep(PAGE.ui || {}), u);
  // 같은 파일을 창 두 개로 열면(발표 창 + 운영 창) 데이터가 자동으로 맞춰진다
  window.addEventListener('storage', e => { if (e.key === PAGE.key) { S = load(); render(); } });
  render();
}

/* ---------- timers ---------- */
const T = {};
function timer(n, min) { if (!T[n]) T[n] = { total: min * 60, left: min * 60, running: false, endAt: 0 }; return T[n]; }
function fmt(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function tToggle(n) {
  const t = T[n]; if (!t) return;
  if (t.running) { t.left = Math.max(0, (t.endAt - Date.now()) / 1000); t.running = false; }
  else { if (t.left <= 0) t.left = t.total; t.endAt = Date.now() + t.left * 1000; t.running = true; }
  tick();
}
function tick() {
  for (const n in T) { const t = T[n]; if (t.running && t.endAt <= Date.now()) { t.running = false; t.left = 0; beep(); } }
  document.querySelectorAll('[data-timer]').forEach(el => {
    const t = T[el.dataset.timer]; if (!t) return;
    const left = t.running ? (t.endAt - Date.now()) / 1000 : t.left;
    el.textContent = left <= 0 ? '마감' : fmt(left);
    el.classList.toggle('warn', left > 0 && left <= 60);
    el.classList.toggle('done', left <= 0);
  });
  document.querySelectorAll('[data-timerbar]').forEach(el => {
    const t = T[el.dataset.timerbar]; if (!t) return;
    const left = t.running ? (t.endAt - Date.now()) / 1000 : t.left;
    el.style.transform = `scaleX(${Math.max(0, Math.min(1, left / t.total))})`;
  });
}
setInterval(tick, 250);
function timerBox(n, min) {
  timer(n, min);
  return `<div class="timerbox"><div class="timer" data-timer="${n}">${fmt(T[n].left)}</div>
    <div class="tbtns"><button class="b sm" data-act="tToggle" data-n="${n}">시작/정지 (T)</button>

/* ---------- 응답 붙여넣기 ---------- */
function parseDelim(text) {
  text = String(text || '').replace(/\r\n?/g, '\n').replace(/\n+$/, '');
  if (!text.trim()) return [];
  const d = text.split('\n')[0].includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') {
        const nx = text[i + 1];
        if (nx === '"') { cur += '"'; i++; }
        else if (nx === d || nx === '\n' || nx === undefined) q = false;
        else { cur = '"' + cur + '"'; q = false; } // 따옴표로 시작했지만 감싸기용이 아니었던 칸
      } else cur += ch;
    } else if (ch === '"' && cur === '') q = true;
    else if (ch === d) { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  row.push(cur); rows.push(row);
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
function table(text) {
  const rows = parseDelim(text);
  if (!rows.length) return null;
  return { h: rows[0].map(s => s.trim()), rows: rows.slice(1) };
}
const isTs = h => /타임스탬프|timestamp/i.test(h);
function nickIdx(h) { return h.findIndex(x => /닉네임|이름/.test(x)); }
function dedupe(list) { const m = new Map(); list.forEach((r, i) => m.set(r.nick ? norm(r.nick) : '#' + i, r)); return [...m.values()]; }
// 1번 질문 응답 표 → [{id, nick, text}]
function parseQ1(t) {
  const ni = nickIdx(t.h);
  let ti = t.h.findIndex(x => /타당|답변|이유/.test(x) && !/닉네임/.test(x));
  if (ti < 0) ti = t.h.length - 1;
  const out = dedupe(t.rows.map(r => ({ nick: ni >= 0 ? (r[ni] || '').trim() : '', text: (r[ti] || '').trim() })).filter(r => r.text));
  out.forEach(r => r.id = hash(norm(r.nick) + '|' + r.text.slice(0, 40)));
  return { out, warn: ni < 0 ? '닉네임 열을 찾지 못했습니다' : '' };
}
const lastWarn = {};
function parseKey(k, text) {
  S.raw[k] = text;
  const t = table(text);
  if (!t) { S.data[k] = []; lastWarn[k] = '내용이 없습니다'; save(); render(); return; }
  const { out, warn } = PAGE.parsers[k](t);
  S.data[k] = out; lastWarn[k] = warn; save(); render();
  toast(out.length + '건 불러옴');
}
function dataBox(k, label, extra) {

    <p class="help">구글 응답 시트에서 해당 탭을 열고 <kbd>Ctrl</kbd>+<kbd>A</kbd> → <kbd>Ctrl</kbd>+<kbd>C</kbd> → 아래 칸에 <kbd>Ctrl</kbd>+<kbd>V</kbd> 하면 바로 불러옵니다. 같은 닉네임이 두 번 내면 마지막 것만 씁니다.</p>

    <div class="row"><button class="b pri" data-act="parse" data-k="${k}">불러오기</button>

}

/* 3. 금지어 게임 — 멤버·진행자 같은 화면(word.html).
   ① 규칙 장면: 규칙 + A/B 주장 + 내 문장(닉네임·A 다시 쓰기·B 다시 쓰기) → [제출]하면 단어 게임 구글폼으로 자동 제출(응답 시트2).
      쓰는 동안 '안다' 계열 표현을 빨갛게 표시하고 제출을 막는다(폼 검증 규칙과 같은 정규식).
   ② 다시 쓴 문장(진행자 PC): 응답을 자동으로 불러와 카드로 보여주고, 골라서 크게 비교. 해설은 넣지 않는다.
   시간 조작줄은 PC에서만(폰 숨김).
   같은 원본으로 두 화면을 만든다: word.html(멤버 — 규칙·내 문장만) / word-board.html(대장님 — 규칙 + 다시 쓴 문장). */
const HOST = false;
const BAN_FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSerYW853NW3D3GHco0EV4GPptksUGaPZGx6A0nQ-f8XgjTGAw/formResponse';
const BAN_NICK = 'entry.1950748642', BAN_A = 'entry.1508685694', BAN_B = 'entry.1463269593';
// 단어 게임 폼의 검증 규칙과 같은 표현 (폼이 거절하는 문장은 화면에서도 막는다)
const BAN_RE = /(안다|알다|아는|알고 ?있|알면|알았|알지|앎|압니다|알아야|알게|알기)/g;
const hasBan = s => { BAN_RE.lastIndex = 0; return BAN_RE.test(String(s || '')); };
const markBan = s => esc(s).replace(BAN_RE, m => `<mark class="ban">${m}</mark>`);
const claim = (k, t) => `<div class="claim ${k}"><div class="who">${k}</div><p>${esc(t)}</p></div>`;

// 구글 시트 타임스탬프 "2026. 10. 25 오전 2:38:43" → ms (못 읽으면 0)
function tsMs(v) {
  const m = String(v || '').match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\s*(오전|오후)?\s*(\d{1,2}):(\d{2}):(\d{2})/);
  if (!m) return 0;
  let h = +m[5]; if (m[4] === '오후' && h < 12) h += 12; if (m[4] === '오전' && h === 12) h = 0;
  return new Date(+m[1], +m[2] - 1, +m[3], h, +m[6], +m[7]).getTime();
}
function parseBan(t) {
  const ni = nickIdx(t.h), ti = t.h.findIndex(isTs);
  const ai = t.h.findIndex(x => /^\s*A의|\bA\b/.test(x) && !isTs(x));
  const bi = t.h.findIndex(x => /^\s*B의|\bB\b/.test(x) && !isTs(x));
  const cut = (U && U.cut) || 0;  // [리셋]을 누른 시각 — 그 전에 낸 응답(테스트 등)은 세지 않는다
  const out = dedupe(t.rows.filter(r => !cut || ti < 0 || tsMs(r[ti]) >= cut)
    .map(r => ({ nick: ni >= 0 ? (r[ni] || '').trim() : '', a: ai >= 0 ? (r[ai] || '').trim() : '', b: bi >= 0 ? (r[bi] || '').trim() : '' }))
    .filter(r => r.a || r.b));
  out.forEach(r => r.id = hash(norm(r.nick) + '|' + r.a.slice(0, 20) + r.b.slice(0, 20)));
  return { out, warn: (ai < 0 || bi < 0) ? 'A/B 열을 찾지 못했습니다' : '' };
}

}

// ---------- 다시 쓴 문장 자동 불러오기 (진행자) ----------

    loadErr = ''; loadedAt = new Date().toTimeString().slice(0, 5);

  } catch (e) { loadErr = '시트를 불러오지 못했습니다 (인터넷 확인)'; if (manual) toast(loadErr); }
  if (!U.ops && U.mode !== 'rule') render();
}

document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (!HOST || e.ctrlKey || e.metaKey || e.altKey || U.mode === 'rule') return;
  if (e.key === 'a' || e.key === 'A' || e.key === 'ㅁ') { if (BAN_CSV) autoLoad(true); else ACT.pasteOpen(); }
});
// 붙여넣기 칸에 붙여넣으면 칸을 닫고 '다시 쓴 문장'으로
document.addEventListener('paste', e => {
  if (!(e.target.closest && e.target.closest('textarea[data-raw="ban"]'))) return;
  setTimeout(() => { if (S.data.ban.length) { U.ops = false; U.mode = U.mode === 'rule' ? 'wall' : U.mode; render(); toast(S.data.ban.length + '명 불러옴'); } }, 120);
});

Object.assign(ACT, {
  mode: b => { U.mode = b.dataset.m; render(); if (U.mode !== 'rule') autoLoad(false); },
  filter: b => { U.filter = b.dataset.f; render(); },
  sel: b => { const id = b.dataset.id; U.sel = U.sel.includes(id) ? U.sel.filter(x => x !== id) : U.sel.concat(id).slice(-4); render(); },
  unsel: () => { U.sel = []; render(); },
  reload: () => autoLoad(true),
  // 게시 주소가 없을 때: 붙여넣기 칸 열기 (붙여넣으면 저절로 닫히고 카드가 바로 나온다)
  pasteOpen: () => { U.ops = true; U.opsTab = 'data'; render(); setTimeout(() => { const t = $('textarea[data-raw="ban"]'); if (t) { t.value = ''; t.focus(); } }, 50); },
  resetCount: () => { if (!confirm('리셋할까요? 지금부터 새로 셉니다. 지금까지의 문장(테스트 등)은 화면에서 빠집니다. 시트에는 그대로 남습니다.')) return; U.cut = Date.now(); U.sel = []; saveU(); reparse(); },
  showAll: () => { U.cut = 0; saveU(); reparse(); },
  wSend: b => {
    if (!wReady() || !confirm('제출할까요? 제출한 뒤에는 고칠 수 없습니다.')) return;
    b.disabled = true; b.textContent = '제출 중…';
    const p = new URLSearchParams(); p.append(BAN_NICK, W.nick.trim()); p.append(BAN_A, W.a.trim()); p.append(BAN_B, W.b.trim());
    fetch(BAN_FORM, { method: 'POST', mode: 'no-cors', body: p })
      .then(() => { W.sent = true; wsave(); render(); })
      .catch(() => { b.disabled = false; b.textContent = '다시 제출'; const e = $('#werr'); e.hidden = false; e.textContent = '제출하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러주세요. (쓴 문장은 그대로 남아 있습니다)'; });
  }
});

setPage({
  key: 'bm1025_3b',
  timer: 'ban',
  noNav: true,
  cfg: {
    form: '',
    rule: "'안다'라는 단어를 사용하지 않고 두 사람의 주장을 다시 설명해 봅시다.",
    claimA: '그건 안다고 하는게 아닙니다. 지행합일. 앎은 행함의 시작이고, 행함은 앎의 완성이다.',
    claimB: '주희에 따르면 어떤 행위가 도덕적으로 옳다는 사실을 인식하는 능력과 그 행위를 실천하는 능력은 서로 구별됩니다.',
    minutes: 3
  },
  fresh: () => ({ raw: { ban: '' }, data: { ban: [] } }),
  ui: { mode: 'rule', filter: 'all', sel: [] },
  parsers: { ban: parseBan },
  step(d) { if (!HOST) return; const o = ['rule', 'wall', 'compare']; U.mode = o[Math.max(0, Math.min(2, o.indexOf(U.mode) + d))]; if (U.mode !== 'rule') autoLoad(false); },
  view() {
    const c = S.cfg;
    if (!HOST) U.mode = 'rule';  // 멤버 화면은 규칙·내 문장만
    if (U.mode === 'rule') return `<section class="stage ruleview"><div class="rulemain">
        <div class="kicker">규칙</div><div class="ban-word">안다</div>
        <h1>${esc(c.rule)}</h1>
        <div class="claims">${claim('A', c.claimA)}${claim('B', c.claimB)}</div>
        ${HOST ? `<div class="hostnote">멤버는 <b>${esc(location.href.replace(/word-board\.html.*$/, 'word.html'))}</b> 에서 문장을 써서 제출합니다 · 다 쓰면 아래 [다시 쓴 문장 보기 →]</div>` : myBox()}</div>
      <aside class="side pconly">${timerBox('ban', c.minutes)}</aside></section>
      ${ctrl(`<button class="b pri" data-act="tToggle" data-n="ban">시간 시작/정지 (T)</button><button class="b" data-act="tReset" data-n="ban" data-m="${c.minutes}">시간 리셋</button><button class="b" data-act="tAdd" data-n="ban">+1분</button>
        ${HOST ? '<button class="b pri" data-act="mode" data-m="wall">다시 쓴 문장 보기 →</button>' : ''}`)}`;
    const all = S.data.ban;
    const card = (r, big) => `<div class="bcard ${!big && U.sel.includes(r.id) ? 'sel' : ''}" ${big ? '' : `data-act="sel" data-id="${r.id}"`}>
        <div class="who"><span>${esc(r.nick || '(닉네임 없음)')}</span>${!big && U.sel.includes(r.id) ? '<span class="picked">선택됨</span>' : ''}</div>
        ${U.filter !== 'B' ? `<div class="ln"><b class="kA">A</b><span>${markBan(r.a)}</span></div>` : ''}
        ${U.filter !== 'A' ? `<div class="ln"><b class="kB">B</b><span>${markBan(r.b)}</span></div>` : ''}</div>`;
    const seg = `<div class="seg">${[['all', 'A·B 둘 다'], ['A', 'A 문장만'], ['B', 'B 문장만']].map(f => `<button class="${U.filter === f[0] ? 'on' : ''}" data-act="filter" data-f="${f[0]}">${f[1]}</button>`).join('')}</div>`;
    const info = `${all.length}명${BAN_CSV && loadedAt ? ` · 자동 갱신 ${loadedAt} (15초마다, A 또는 [최신화] = 지금 바로)` : ''}${U.cut ? ` · <b class="cutnote">${new Date(U.cut).toTimeString().slice(0, 5)} 이후만 집계</b> <b class="lnk" data-act="showAll">전체 보기</b>` : ''}`;
    const top = `<div class="wtop"><div class="wtitle"><button class="back" data-act="mode" data-m="${U.mode === 'compare' ? 'wall' : 'rule'}">←</button><div><h2>${U.mode === 'compare' ? '골라 본 문장' : "'안다' 없이 다시 쓴 문장"}</h2><span class="winfo">${info}</span></div></div>
      <div class="wbtns">${seg}${BAN_CSV ? '<button class="tbtn reload" data-act="reload">⟳ 최신화 <kbd>A</kbd></button>' : '<button class="tbtn reload" data-act="pasteOpen">📋 응답 붙여넣기</button>'}<button class="tbtn reset" data-act="resetCount">↺ 리셋</button></div></div>`;
    if (U.mode === 'compare') {
      const sel = U.sel.map(id => all.find(r => r.id === id)).filter(Boolean);
      return `<section class="stage wallview">${top}<div class="compare" style="grid-template-columns:repeat(${Math.max(1, sel.length)},minmax(0,1fr))">
        ${sel.map(r => card(r, true)).join('') || '<p class="help">고른 문장이 없습니다. ← 눌러 돌아가서 카드를 눌러 고르세요.</p>'}</div></section>`;
    }
    const empty = !all.length ? `<div class="wempty"><b>${loadErr ? esc(loadErr) : BAN_CSV ? '문장을 기다리는 중입니다' : '아직 문장을 불러오지 않았습니다'}</b><span>${BAN_CSV ? '응답 시트를 자동으로 불러옵니다 · <kbd>A</kbd> 지금 다시 불러오기' : '위쪽 [📋 응답 붙여넣기]를 누르고, 응답 시트 "설문지 응답 시트2" 탭을 <kbd>Ctrl</kbd>+<kbd>A</kbd> → <kbd>Ctrl</kbd>+<kbd>C</kbd> 해서 붙여넣으세요'}</span></div>` : '';
    const selbar = U.sel.length ? `<div class="selbar"><span>${U.sel.length}개 골랐어요 (최대 4개)</span><button class="tbtn main" data-act="mode" data-m="compare">크게 보기</button><button class="tbtn" data-act="unsel">선택 해제</button></div>` : '';
    return `<section class="stage wallview">${top}<p class="whint">카드를 누르면 골라져요. 골라서 [크게 보기]로 나란히 비교할 수 있어요. 빨간 표시는 '안다'와 같은 표현이에요.</p>
      <div class="wall">${all.map(r => card(r)).join('')}</div>${empty}</section>${selbar}`;
  },
  opsTabs: [
    ['data', '응답 불러오기', () => dataBox('ban', '금지어 게임 응답')],
    ['cfg', '설정', () => `<div class="box"><h3>문구</h3><div class="fgrid">
      ${fld('rule', '규칙', { ta: 2 })}${fld('claimA', 'A 핵심 주장', { ta: 2 })}${fld('claimB', 'B 핵심 주장', { ta: 2 })}${fld('minutes', '타이머(분)')}</div></div>${backupBox()}`]
  ]
});
if (HOST) { autoLoad(false); setInterval(() => { if (U.mode !== 'rule') autoLoad(false); }, 15000); }

</script>
</body>
</html>
