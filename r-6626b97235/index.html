<style>

const DATA = {"id": "2026102502115", "title": "두 사람 중 누구의 주장이 더 타당한가?", "note": "자물쇠는 이 답변에서 발견되지 않은 사고 유형이라는 뜻일 뿐, 낮은 점수나 실패가 아닙니다. 한 사람이 여러 유형에 해당할 수 있어 다섯 비율의 합이 100%를 넘을 수 있습니다.", "total": 5, "endings": [{"no": 1, "title": "A/B 중 하나를 선택", "desc": "A 또는 B 중 하나의 타당성을 주장했다", "count": 3, "pct": 60}, {"no": 2, "title": "조건에 따른 판단", "desc": "상황이나 조건에 따라 A/B의 타당성이 달라진다고 판단했다", "count": 1, "pct": 20}, {"no": 3, "title": "선택 구조 검토", "desc": "A/B라는 선택 구조 자체를 검토했다", "count": 1, "pct": 20}, {"no": 4, "title": "'안다'의 의미 분해", "desc": "'안다'라는 단어에 서로 다른 의미가 있다는 점을 구체적으로 분석했다", "count": 1, "pct": 20}, {"no": 5, "title": "행동 원인 진단", "desc": "옳고 그름의 논쟁을 실제로 행동하지 못하는 원인을 진단하는 문제로 전환했다", "count": 0, "pct": 0}], "members": [{"nick": "오키", "submittedAt": "2026. 10. 25 오전 2:08:17", "text": "저는 A의 주장에 조금 더 동의합니다. 다만 모든 행동이 즉시 나타나야만 안다고 할 수 있다는 뜻은 아닙니다. 예를 들어 운동이 중요하다는 사실을 진지하게 받아들인 사람이 부상 때문에 운동을 쉬는 경우도 있습니다. 이 사람은 행동하지 못했지만 그 중요성을 모르고 있다고 보기는 어렵습니다. 따라서 실천할 수 있는 상황인데도 계속 미루는 사람에게는 A의 주장이 설득력 있지만, 실행을 가로막는 현실적인 조건이 있다면 B의 설명이 더 적절할 수도 있다고 생각합니다.", "endings": [{"no": 1, "reason": "\"저는 A의 주장에 조금 더 동의합니다\"라며 A 쪽의 타당성을 먼저 주장했습니다."}, {"no": 2, "reason": "\"실천할 수 있는 상황인데도 계속 미루는 사람에게는 A의 주장이 설득력 있지만\", 현실적인 조건이 있으면 \"B의 설명이 더 적절할 수도 있다\"며 상황에 따라 타당성이 달라진다고 판단했습니다."}], "note": "A에 조금 더 동의한다고 밝힌 뒤 결론은 조건에 따른 판단으로 맺어 1번과 2번을 함께 줌.", "file": "오키"}, {"nick": "히프노스", "submittedAt": "2026. 10. 25 오전 2:08:53", "text": "저는 B가 더 타당하다고 생각합니다. 어떤 행동이 필요하다는 사실을 이해하는 것과 실제로 그 행동을 선택하는 것은 별개의 문제라고 봅니다. 예를 들어 담배가 건강에 해롭다는 사실을 정확하게 이해하는 의사도 흡연할 수 있습니다. 그렇다고 그 의사가 흡연의 위험성을 모른다고 판단할 수는 없습니다. 오히려 알고 있으면서도 행동하지 않는다는 사실을 인정해야 인간의 의지와 욕망 사이에서 발생하는 문제를 설명할 수 있다고 생각합니다.", "endings": [{"no": 1, "reason": "\"저는 B가 더 타당하다고 생각합니다\"라며 위험을 이해하는 의사도 흡연할 수 있다는 예로 B의 타당성을 주장했습니다."}], "note": "", "file": "히프노스"}, {"nick": "호나인", "submittedAt": "2026. 10. 25 오전 2:09:30", "text": "저는 A와 B 중 어느 쪽이 더 타당한지를 선택하는 질문 자체가 조금 이상하다고 생각합니다. 두 사람이 논쟁하는 이유는 서로 다른 문제를 해결하려고 하기 때문일 수도 있습니다. A는 실제 행동을 변화시키기 위해 어떤 말을 해야 하는지에 관심이 있고, B는 인간이 지식을 가지고 있다는 것을 어떻게 판단할지에 관심이 있는 것 같습니다. 그렇다면 서로 다른 목적을 가진 주장을 하나의 기준으로 비교해서 승자를 정하는 것이 적절한지부터 검토해야 한다고 생각합니다.", "endings": [{"no": 3, "reason": "\"A와 B 중 어느 쪽이 더 타당한지를 선택하는 질문 자체가 조금 이상하다\"며 목적이 다른 주장을 \"하나의 기준으로 비교해서 승자를 정하는 것이 적절한지부터 검토\"해야 한다고 선택 구조 자체를 따져봤습니다."}], "note": "", "file": "호나인"}, {"nick": "달콩", "submittedAt": "2026. 10. 25 오전 2:10:12", "text": "저는 A의 주장이 현실적으로 더 도움이 된다고 생각합니다. 해야 한다는 말을 수없이 반복하면서도 아무런 행동을 하지 않는 사람이 자신은 이미 충분히 이해했다고 생각한다면 변화가 일어나기 어렵기 때문입니다. 물론 행동하지 않았다고 지식이 전혀 없다는 결론을 내릴 수는 없겠지만, 자신에게 필요한 행동을 계속 미루는 사람에게는 무엇을 알고 있는지보다 얼마나 실행했는지가 더 중요할 수 있습니다. 이번 댓글의 상황에서는 A의 표현이 더 의미 있다고 판단했습니다.", "endings": [{"no": 1, "reason": "\"저는 A의 주장이 현실적으로 더 도움이 된다고 생각합니다\"라며 \"이번 댓글의 상황에서는 A의 표현이 더 의미 있다\"고 A 쪽을 주장했습니다."}], "note": "'이번 댓글의 상황에서는'은 판단 범위를 밝힌 것이고 상황별로 A/B를 나눠 판단하지는 않아 2번은 주지 않음.", "file": "달콩"}, {"nick": "비채", "submittedAt": "2026. 10. 25 오전 2:10:22", "text": "저는 두 사람이 말하는 지식의 종류가 서로 다를 가능성을 생각했습니다. 요리법을 책으로 읽고 재료와 순서를 외우는 것과 실제로 맛있는 음식을 만들 수 있는 것은 다릅니다. 전자는 설명할 수 있다는 의미에서의 지식이고 후자는 수행할 수 있다는 의미에서의 능력입니다. 그런데 공부가 중요하다는 사실을 이해하는 것과 공부를 실제로 수행하는 것도 같은 관계인지 검토해야 합니다. 이 차이를 구분하지 않으면 A와 B의 주장을 정확히 비교하기 어렵다고 생각합니다.", "endings": [{"no": 4, "reason": "요리법을 외우는 것과 실제로 음식을 만드는 것을 예로 \"설명할 수 있다는 의미에서의 지식\"과 \"수행할 수 있다는 의미에서의 능력\"을 나눠 설명했습니다."}], "note": "'이 차이를 구분하지 않으면 A와 B의 주장을 정확히 비교하기 어렵다'는 비교의 전제를 짚은 것이지 A/B 선택 구조 자체를 검토한 것은 아니어서 3번은 주지 않음.", "file": "비채"}], "reps": {"1": ["히프노스", "달콩"], "2": ["오키"], "3": ["호나인"], "4": ["비채"]}, "meta": {"source": "응답.csv", "preparedAt": "2026-10-25 02:11", "analyzer": "Claude Code (claude-opus-5-5) — 테스트7 (실제 구글폼 5명)", "analyzedAt": "2026-10-25 02:11"}};
const RK = 'bm1025_reps_' + DATA.id;

  return `<div class="chartbox" id="chartbox"><div class="dstage"><svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#cdcdcd"/>
    <polygon points="0,0 420,0 0,640" fill="#d6d6d6"/><polygon points="210,150 580,900 -160,900" fill="#c3c3c3"/>
    <polygon points="560,0 990,0 775,430" fill="#d9d9d9"/><polygon points="830,150 1250,900 410,900" fill="#c6c6c6"/>
    <polygon points="1100,0 1600,0 1600,720" fill="#d4d4d4"/><polygon points="1250,150 1640,880 880,880" fill="#c8c8c8" opacity=".85"/>
    <rect width="1600" height="150" fill="#e4e4e4" opacity=".8"/><rect width="270" height="150" fill="#f0f0f0"/><line x1="0" y1="150" x2="1600" y2="150" stroke="#b3b3b3" stroke-width="1.5"/>
    ${[[95, 700], [640, 245], [1180, 185], [700, 800], [1450, 790]].map(([x, y]) => `<path class="cross" d="M${x - 11} ${y}h22M${x} ${y - 11}v22"/>`).join('')}${lines}</svg>
    <div class="dhead"><div class="t1">통계</div><div class="t2"><span class="glob">◎</span><div><b>우리 모임 통계</b><span>퍼센트</span></div></div></div>
    <div class="chap"><small>참여 ${DATA.total}명</small><div class="pb"></div><h2>10.25 질문</h2></div>
    <div class="thumb">A<i>/</i>B</div><div class="startbar">${esc(DATA.title)}</div>${nodes}
    <div class="dnote">비율 = 해당 유형 인원 ÷ 전체 ${DATA.total}명 · 한 사람이 여러 유형에 해당할 수 있어 합계가 100%를 넘을 수 있음</div></div></div>`;
}
function fit() { const box = $('#chartbox'); if (!box) return; const k = box.clientWidth / 1600; box.style.height = (900 * k) + 'px'; box.querySelector('.dstage').style.transform = `scale(${k})`; }
window.addEventListener('resize', fit);

function personal(m) {
  const mine = new Map(m.endings.map(e => [e.no, e.reason]));
  const nodes = DATA.endings.map(e => {
    const on = mine.has(e.no);
    return `<div class="node ${on ? 'on' : ''}"><div class="bar"><span class="no">${on ? '' : `<span class="lock">${LOCK}</span>`}ENDING ${e.no}</span>${esc(e.title)}<span class="pct"><b>${e.pct}<small>%</small></b></span></div>
      <div class="sub">${esc(e.desc)}${on ? `<div class="why"><b>AI 근거</b>${esc(mine.get(e.no))}</div>` : ''}</div></div>`;
  }).join('');
  return `<div class="pv"><div class="pchart"><div class="pstart"><div class="th">A<i>/</i>B</div><div class="sb">${esc(m.nick)}님의 엔딩 · 해금 ${m.endings.length}개</div></div><div class="nodes">${nodes}</div></div>
    <div><div class="card"><div class="k">제출 답변 원문 · ${esc(m.submittedAt || '')} · ${m.text.length}자</div><p>${esc(m.text)}</p></div>
      ${m.note ? `<div class="reason" style="margin-top:10px;color:#666">분석 메모: ${esc(m.note)}</div>` : ''}
      <div class="reason" style="margin-top:10px">멤버용 파일: 결과/개인/${esc(m.file)}.png · .html</div></div></div>`;
}
function memCard(m, focus) {
  const rs = m.endings.filter(e => !focus || e.no === focus);
  return `<div class="mem ${m.endings.length ? 'has' : ''}"><div class="mhead"><b>${esc(m.nick)}</b><span>${esc(m.submittedAt || '')} · ${m.text.length}자 · ${m.endings.length ? m.endings.map(e => 'E' + e.no).join(', ') : '해당 유형 없음'}</span></div>
    <div class="mtext">${esc(m.text)}</div>${rs.map(e => `<div class="reason"><b>E${e.no}</b> ${esc(e.reason)}</div>`).join('')}
    <div style="margin-top:8px">${m.endings.map(e => `<button class="star ${repsOf(e.no).includes(m.nick) ? 'on' : ''}" data-rep="${esc(m.nick)}" data-no="${e.no}">★ E${e.no} 대표</button>`).join('')}</div></div>`;
}
function render() {
  const m = DATA.members.find(x => x.nick === sel);
  $('#app').innerHTML = `<div class="top"><h1>10.25 전체 엔딩 차트</h1><span class="warn">대장님 확인용 · 모든 멤버의 답변이 들어 있으니 멤버에게 공유하지 마세요</span>
      <span class="meta">${esc(DATA.meta.analyzer || '')} · ${esc(DATA.meta.analyzedAt || '')}</span></div>
    <div class="wrap">${chart()}
      <h3>멤버별 엔딩 (${DATA.members.length}명) — 이름을 누르면 그 멤버의 개인 플로차트</h3>
      <div class="picker">${DATA.members.map(x => `<button class="b ${x.nick === sel ? 'on' : ''}" data-pick="${esc(x.nick)}">${esc(x.nick)}</button>`).join('')}</div>
      ${m ? personal(m) : ''}
      <h3>유형별 대표 답변 <button class="b" id="repJson" style="font-size:12px;padding:3px 10px">대표 답변 지정 내용 복사</button> <button class="b" id="repReset" style="font-size:12px;padding:3px 10px">분석 결과 기본값으로</button></h3>
      ${DATA.endings.map(e => `<div class="repbox"><span class="t">E${e.no} ${esc(e.title)}</span> — ${repsOf(e.no).length ? repsOf(e.no).map(n => { const x = DATA.members.find(y => y.nick === n); return x ? `<div class="reason"><b>${esc(n)}</b> ${esc(x.text)}</div>` : ''; }).join('') : '<span class="reason">지정 없음 (아래 ★로 지정)</span>'}</div>`).join('')}
      <h3>전체 답변 원문과 분류 근거</h3>${DATA.members.map(x => memCard(x)).join('')}
    </div>`;
  fit();
}
function endingModal(no) {
  const e = DATA.endings.find(x => x.no === no), ms = DATA.members.filter(m => has(m, no));
  $('#modal').innerHTML = `<div class="mbox"><div class="kk">ENDING ${no}</div><h2>${esc(e.title)}</h2><div style="color:#555">${esc(e.desc)} · ${e.count}명 (${e.pct}%)</div>
    <h3>해당 멤버</h3>${ms.map(m => memCard(m, no)).join('') || '<div class="reason">없음</div>'}<button class="b" data-close>닫기</button></div>`;
  $('#modal').hidden = false;
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-no]'); if (!t) { if (e.target.id === 'modal') $('#modal').hidden = true; return; }
  if (t.dataset.close !== undefined) { $('#modal').hidden = true; return; }
  if (t.dataset.pick) { sel = t.dataset.pick; render(); return; }
  if (t.dataset.rep) {
    const no = +t.dataset.no, list = new Set(repsOf(no)); list.has(t.dataset.rep) ? list.delete(t.dataset.rep) : list.add(t.dataset.rep);
    reps = Object.assign({}, reps, { [no]: [...list] }); try { localStorage.setItem(RK, JSON.stringify(reps)); } catch (err) {}
    const open = !$('#modal').hidden; render(); if (open) endingModal(no); return;
  }
  if (t.id === 'repJson') { const s = JSON.stringify(reps); navigator.clipboard ? navigator.clipboard.writeText(s).then(() => alert('복사했습니다. 분석결과.json의 "reps"에 붙여넣으면 저장됩니다.')) : prompt('복사하세요', s); return; }
  if (t.id === 'repReset') { reps = DATA.reps; try { localStorage.removeItem(RK); } catch (err) {} render(); return; }
  if (t.dataset.no) endingModal(+t.dataset.no);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal').hidden = true; });
render();
</script>
</body>
</html>
