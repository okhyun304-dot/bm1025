<!-- 1. 기습질문 — 멤버가 직접 답을 쓰는 화면 (구글폼 대신).

<style>
:root{--ink:#f2f4f6;--dim:#9fb3c6;--blue:#1f8bff;--cyan:#58a8ff;--A:#4aa8ff;--B:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;background:#05080c;color:var(--ink);font-family:'Noto Sans KR',sans-serif;-webkit-text-size-adjust:100%}
body{background:radial-gradient(ellipse at 70% 20%,#2a3846 0%,#121b24 45%,#05080c 100%) fixed,#05080c;word-break:keep-all;overflow-wrap:anywhere}
.rain{position:fixed;inset:-200px;pointer-events:none;z-index:0;background-image:repeating-linear-gradient(100deg,rgba(255,255,255,.045) 0 1px,transparent 1px 13px);background-size:220px 220px;animation:rain .45s linear infinite}
@keyframes rain{to{background-position:-40px 220px}}
.clock{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;background:rgba(5,8,12,.94);padding:10px 16px;border-bottom:1px solid rgba(31,139,255,.35)}
.clock .tag{font-size:12px;letter-spacing:.2em;color:var(--dim);margin-right:auto}
.clock .timer{font-size:26px;font-weight:300;font-variant-numeric:tabular-nums}
.clock .timer.warn{color:#ffb547}.clock .timer.done{color:#ff5d6c;font-size:15px;font-weight:500}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:18px 16px 60px}
.sec{margin-top:26px}.sec:first-child{margin-top:0}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sh .n{width:26px;height:26px;border:1px solid var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--cyan)}
.sh b{font-size:14px;letter-spacing:.16em;color:var(--dim);font-weight:500}
.qbox{background:rgba(8,11,14,.86);border-left:4px solid var(--blue);padding:18px 18px;font-size:20px;line-height:1.6}
.src{background:rgba(8,11,14,.72);padding:12px 16px;font-size:15px}
.src a{color:var(--cyan);word-break:break-all}
.ch{display:flex;gap:8px;margin-bottom:10px}
.ch .ct{flex:1;background:rgba(8,11,14,.8);padding:14px 16px;font-size:17px;line-height:1.6}
.ch .ck{flex:0 0 44px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;background:rgba(8,11,14,.8)}
.ck.A{color:var(--A)}.ck.B{color:var(--B)}
.evid{background:rgba(8,11,14,.72);border-top:2px solid var(--blue);padding:14px 12px}
.evid .hd{font-size:13px;color:#b8c7d4;margin:0 4px 12px;line-height:1.6}
.yc{display:flex;gap:10px;margin-bottom:10px;padding:12px 12px;background:rgba(255,255,255,.055);border-left:4px solid #6b7785}
.yc:last-child{margin-bottom:0}
.yc.reply{margin-left:16px}
.yc>div:last-child{flex:1;min-width:0}
.yc.wA{border-left-color:var(--A)}.yc.wB{border-left-color:var(--B)}
.yav{flex:0 0 32px;height:32px;border-radius:50%;background:#3a4654;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.yav.A{background:var(--A);color:#04121f}.yav.B{background:var(--B);color:#1f1700}.yav.anon{font-size:10px}
.yh{font-size:13px;color:#b8c7d4}.yh b{color:#fff}
.yc.wA .yh b{color:#7cc0ff}.yc.wB .yh b{color:#ffe07a}
.yc p{margin:4px 0 0;font-size:16px;line-height:1.7;color:#f4f7fa;white-space:pre-wrap}
.men{color:#7cc0ff;font-weight:700}
.answer{margin-top:30px;background:rgba(8,11,14,.9);border:1px solid #2f5677;padding:18px 16px}
.answer h2{margin:0 0 4px;font-size:18px;font-weight:700}
.answer .note{font-size:13px;color:var(--dim);margin:0 0 16px;line-height:1.6}
label{display:block;font-size:14px;color:var(--dim);margin:14px 0 6px}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;background:#0b1117;color:#fff;border:1px solid #3f6a8f;outline:none;border-radius:0}
input[type=text]:focus,textarea:focus{border-color:var(--cyan)}
textarea{min-height:220px;line-height:1.65;resize:vertical}
.cnt{text-align:right;font-size:13px;color:var(--dim);margin-top:6px;font-variant-numeric:tabular-nums}
.cnt.ok{color:#7fd38a}
.btn{display:block;width:100%;margin-top:16px;padding:16px;font:inherit;font-size:18px;font-weight:700;letter-spacing:.06em;color:#04121f;background:var(--cyan);border:0;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.err{color:#ff8a8a;font-size:14px;margin-top:10px;line-height:1.6}
.done{text-align:center;padding:40px 0 10px}
.done h2{font-size:28px;font-weight:300;letter-spacing:.06em;margin:0 0 10px}
.done p{color:var(--dim);font-size:15px;line-height:1.7}
.mine{margin-top:22px;text-align:left;background:rgba(8,11,14,.86);border-left:3px solid var(--blue);padding:14px 16px;font-size:15px;line-height:1.7;white-space:pre-wrap}
.mine small{display:block;color:var(--dim);font-size:12px;letter-spacing:.14em;margin-bottom:6px}
</style>
</head>

<script>
// 기습질문 구글폼 (자동 제출 대상). 항목 번호는 폼 화면에서 읽은 값 — 폼을 다시 만들면 바꿔야 함

  {

  {

  },
  {
    "who": "B",
    "reply": true,
    "text": "@A 지행합일설을 주장하시는 근거가 궁금합니다. 주희에 따르면 어떤 행위가 도덕적으로 옳다는 사실을 인식하는 능력과 그 행위를 실천하는 능력은 서로 구별됩니다. 두 능력이 상호 의존한다는 사실만으로 그 둘이 동일하다는 결론은 도출되지 않는다고 보는게 합당합니다."

  {

  },
  {
    "who": "B",
    "reply": true,
    "text": "@A 제가 주장한 것은 단순히 안다고 말하면 무엇이든 아는 것으로 인정해야 한다는 것이 아닙니다. 실제로 어떤 사실을 알고 있다는 것과 그 사실을 알고 있다고 주장하는 것은 엄연히 다른 문제입니다. 따라서 모든 진리를 안다고 주장할 수도 있다는 반론은 제 주장을 왜곡한 허수아비 논증에 가깝습니다.\n주희의 지행상수론에 따르면 앎과 행위는 상호 의존하지만 서로 구별되는 활동입니다. 두 개념이 밀접하게 연관되어 있다는 사실만으로 본질적으로 동일하다는 결론이 도출되지는 않습니다. 또한 칸트의 도덕철학에서도 인간은 이성을 통해 도덕법칙을 인식하면서도 자신의 경향성에 따라 그 법칙에 어긋나는 준칙을 선택할 수 있습니다. 도널드 데이비드슨 역시 인간이 모든 사정을 고려하여 더 낫다고 판단한 선택과 반대되는 행위를 의도적으로 수행할 가능성을 논의했습니다.\n그런데도 실천하지 않았다는 이유만으로 참된 앎이 존재하지 않았다고 주장한다면, 먼저 실천이 참된 앎의 필수조건이라는 사실을 입증해야 합니다. 이를 입증하지 않고 실천하지 않은 사람은 애초에 알지 못했다고 규정하는 것은 증명해야 할 결론을 전제하는 선결문제 요구에 가까워집니다.\n따라서 제가 묻고 싶은 것은 단순합니다. 도덕적 명제의 의미와 근거를 충분히 이해하고 그 타당성까지 인정하는 사람이 자신의 욕망이나 이익 때문에 그에 반하는 행동을 선택했을 때, 그 사람이 진정으로 알지 못했다고 판단할 독립적인 근거는 무엇인지 여쭤보고 싶습니다."
  },
  {
    "who": "A",
    "reply": true,
    "text": "@B 그럼 당신 안다고 말하는건 무엇입니까? 당신이 말하는 안다라는걸 먼저 정의하고 가야할거 같습니다."
  },
  {
    "who": "B",
    "reply": true,
    "text": "@A 제 의견을 물어봐주시니 기쁠 따름입니다. 제가 생각하는 앎이란 어떤 사실이나 원리를 올바르게 인식하고, 그 의미와 근거를 이해하는 것입니다. 물론 안다고 주장하는 것과 실제로 아는 것은 구별되어야 하며, 단순히 안다고 말한다고 해서 앎이 성립하는 것은 아닙니다.\n이러한 관점은 철학적으로도 근거가 있습니다. 길버트 라일은 명제적 앎과 방법적 앎을 구별했으며, 아리스토텔레스 역시 이론적 지식과 실천적 지혜를 구분했습니다. 또한 도널드 데이비드슨은 인간이 모든 사정을 고려하여 더 낫다고 판단한 선택과 반대되는 행위를 의도적으로 수행할 수 있다고 설명했습니다.\n저 역시 도덕적 원칙을 이해하는 것과 그 원칙에 따라 행동하는 것이 반드시 동일하다고 생각하지 않습니다. 인간은 어떤 행위가 악하다는 사실과 그 이유를 충분히 이해하면서도 자신의 욕망이나 이익을 위해 악행을 선택할 수 있기 때문입니다.\n왕양명은 이를 참된 앎이 아니라고 정의할 수 있겠지만, 그렇다면 실천하지 않았다는 사실만으로 참된 앎이 부재했다고 판단할 독립적인 근거가 필요하다고 생각합니다. 앎과 행위가 본래 하나라는 주장을 전제하여 실천하지 않았으므로 알지 못했다고 설명한다면, 이는 지행합일론을 논증하기보다 그 정의를 반복하는 것에 불과할 수 있습니다.\n따라서 제가 문제 삼는 것은 실천의 중요성이 아니라, 실천이 반드시 앎의 성립 조건이어야 한다는 주장입니다. \n물론 제 사상이 틀리거나 모순되는 부분이 있을 수 있기에 문제를 짚어주시면 그에 대해 검토하고 수용하겠습니다."

  {

    "text": "@A 앞선 제 의견에 칸트의 실천철학을 결부하여 한 가지 덧붙이고 싶습니다.\n칸트는 인간이 이성을 통해 도덕법칙을 인식할 수 있으며, 그 이성이 단순히 무엇이 옳은지 판단하는 데 그치지 않고 도덕적 행위의 동기까지 제공할 수 있다고 보았습니다. 특히 도덕법칙에 대한 존경은 실천이성이 의지에 영향을 미치는 도덕적 동기로 이해할 수 있습니다.\n저 역시 이성은 도덕적 판단을 내릴 뿐만 아니라, 그 판단에 따라 행동해야 할 이유와 동기까지 제공한다고 생각합니다. 그러나 여기서 구별해야 할 것은 도덕적 동기가 존재한다는 사실과 그 동기가 반드시 행위를 결정한다는 주장은 서로 다르다는 점입니다.\n칸트에 따르면 인간은 이성적 존재인 동시에 감성적 욕망과 경향성을 지닌 존재입니다. 따라서 도덕법칙을 인식하고 그에 따라 행동해야 할 이유를 인정하면서도, 자신의 욕망이나 이익을 우선하여 도덕법칙에 어긋나는 선택을 할 수 있습니다.\n이러한 관점에서 저는 도덕적 앎이 실천의 근거와 동기를 제공한다는 사실을 부정하지 않습니다. 다만 그 앎이 반드시 실천을 수반해야 한다는 필연성에는 의문을 제기하는 것입니다.\n왕양명의 지행합일설이 도덕적 앎과 실천의 긴밀한 관계를 강조한다는 점은 이해합니다. 그러나 앎이 행위의 동기를 제공한다는 사실로부터 앎과 행위가 본질적으로 동일하다는 결론이 논리적으로 도출되는지는 별도로 검토해야 한다고 생각합니다.\n결국 제 주장은 이성이 도덕적 행위에 아무런 영향을 미치지 않는다는 것이 아니라, 이성이 도덕적 동기를 제공하더라도 인간이 그 동기에 반하는 선택을 할 가능성은 여전히 존재한다는 것입니다. 따라서 실천의 부재가 곧 앎의 부재를 의미한다는 주장에는 추가적인 논증이 필요하다고 생각합니다."
  }

var KEY = 'bm1025_answer';
var S = (function () { try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch (e) {} return { v: 1, nick: '', text: '', startedAt: Date.now(), sent: false }; })();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
save();
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var app = document.getElementById('app');

function sh(n, t) { return '<div class="sh"><span class="n">' + n + '</span><b>' + t + '</b></div>'; }
function comments() {
  return THREAD.map(function (c) {
    var anon = /^익명/.test(c.who), who = anon ? '익명' : c.who;
    return '<div class="yc ' + (c.reply ? 'reply ' : '') + (anon ? '' : 'w' + esc(who)) + '"><div class="yav ' + (anon ? 'anon' : esc(who)) + '">' + esc(who) + '</div><div>' +
      '<div class="yh"><b>' + (anon ? esc(c.who) : '@' + esc(c.who)) + '</b></div>' +
      '<p>' + esc(c.text).replace(/^(@(?:A|B|익명\d+))/, '<span class="men">$1</span>') + '</p></div></div>';
  }).join('');
}

function render() {
  if (S.sent) return renderDone();
  var h = '<div class="sec">' + sh(1, '질문') + '<div class="qbox">' + esc(Q.question) + '</div></div>';

  h += '<div class="sec">' + sh(3, 'A / B 핵심 주장') +
    '<div class="ch"><span class="ct">' + esc(Q.claimA) + '</span><span class="ck A">A</span></div>' +
    '<div class="ch"><span class="ct">' + esc(Q.claimB) + '</span><span class="ck B">B</span></div></div>';
  h += '<div class="sec">' + sh(4, '원문 댓글') + '<div class="evid"><div class="hd">유튜브 댓글 중 원 댓글과 A·B가 주고받은 댓글을 원문 그대로 실었습니다. 작성자 이름만 A·B로 바꾸고 좋아요 수는 가렸습니다.</div>' + comments() + '</div></div>';
  h += '<div class="answer"><h2>내 답변</h2><p class="note">제출한 답변은 진행자만 봅니다. 다른 멤버의 답변은 보이지 않습니다. 제출한 뒤에는 고칠 수 없습니다.</p>' +
    '<label for="nick">닉네임 (텔레그램 닉네임 그대로)</label><input type="text" id="nick" maxlength="40" autocomplete="off" value="' + esc(S.nick) + '">' +
    '<label for="ans">답변</label><textarea id="ans">' + esc(S.text) + '</textarea><div class="cnt" id="cnt"></div>' +
    '<button class="btn" id="send">제출</button><div class="err" id="err" hidden></div></div>';
  app.innerHTML = h;
  var n = document.getElementById('nick'), a = document.getElementById('ans'), b = document.getElementById('send');
  function upd() {
    S.nick = n.value; S.text = a.value; save();
    var len = a.value.replace(/\s/g, '').length, c = document.getElementById('cnt');
    c.textContent = a.value.length + '자 (200~400자)'; c.className = 'cnt' + (a.value.length >= 200 && a.value.length <= 400 ? ' ok' : '');
    b.disabled = !n.value.trim() || !len;
  }
  n.addEventListener('input', upd); a.addEventListener('input', upd); upd();
  b.addEventListener('click', submit);
}

function renderDone() {
  app.innerHTML = '<div class="done"><h2>제출되었습니다</h2><p>' + esc(S.nick) + '님의 답변이 기록되었습니다.<br>진행자의 안내를 기다려 주세요.</p>' +
    '<div class="mine"><small>내가 제출한 답변</small>' + esc(S.text) + '</div></div>';
  window.scrollTo(0, 0);
}

function submit() {
  var nick = S.nick.trim(), text = S.text.trim();
  if (!nick || !text) return;
  if (!confirm('제출할까요? 제출한 뒤에는 고칠 수 없습니다.')) return;
  var b = document.getElementById('send'), err = document.getElementById('err');
  b.disabled = true; b.textContent = '제출 중…'; err.hidden = true;
  var p = new URLSearchParams();
  p.append(E_NICK, nick); p.append(E_ANSWER, text);
  fetch(FORM, { method: 'POST', mode: 'no-cors', body: p }).then(function () {
    S.nick = nick; S.text = text; S.sent = true; save(); render();
  }).catch(function () {
    b.disabled = false; b.textContent = '다시 제출'; err.hidden = false;
    err.textContent = '제출하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러주세요. (쓴 답변은 그대로 남아 있습니다)';
  });
}

// 남은 시간: 이 화면을 처음 연 때부터 5분 (표시용 — 시간이 지나도 제출은 됨)
function tick() {
  var left = Math.round(MINUTES * 60 - (Date.now() - S.startedAt) / 1000), t = document.getElementById('timer');
  if (S.sent) { t.textContent = '제출 완료'; t.className = 'timer done'; return; }
  if (left <= 0) { t.textContent = '시간이 다 됐습니다 · 지금 제출해 주세요'; t.className = 'timer done'; return; }
  t.textContent = Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2);
  t.className = 'timer' + (left <= 60 ? ' warn' : '');
}
render(); tick(); setInterval(tick, 1000);
</script>
</body>
</html>
